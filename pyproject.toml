[project]
name = "scrapper-agent"
version = "0.1.0"
description = "AI agent that scrapes and analyzes company reviews from Google and other sites"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "playwright>=1.48.0",
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
    "gradio>=5.0.0",
    "openai>=1.50.0",
    "anthropic>=0.40.0",
    "pydantic>=2.0.0",
    "fpdf2>=2.8.0",
]
